<div class="admin-modal">
  <div class="admin-modal-head">
    <h1 id="admin-modal-title">{{ editingId() ? 'Modifier l’actualité' : 'Nouvelle actualité' }}</h1>
    <button appClose type="button" (click)="close()"></button>
  </div>
  <form class="form form-grid" method="post" novalidate (submit)="$event.preventDefault(); save()">
    <label>Titre <input [formField]="form.title" (blur)="fillSlug()" /><app-field-error [field]="form.title" /></label>
    <label>Identifiant d’adresse <input [formField]="form.slug" /><app-field-error [field]="form.slug" pattern="Utilisez des minuscules, des chiffres et des tirets." /></label>
    <label>Catégorie <input [formField]="form.category" /><app-field-error [field]="form.category" /></label>
    <label>Date <input type="datetime-local" [formField]="form.publishedAt" /><app-field-error [field]="form.publishedAt" /></label>
    <label>Résumé <textarea [formField]="form.excerpt"></textarea><app-field-error [field]="form.excerpt" /></label>
    <label>Texte <textarea [formField]="form.body" style="min-height: 16rem"></textarea><app-field-error [field]="form.body" /></label>
    <p style="color: var(--muted)">Une ligne vide sépare les paragraphes.</p>
    <label>Source <input [formField]="form.sourceLabel" /></label>
    <label>Lien de la source <input [formField]="form.sourceUrl" /></label>
    <label class="check"><input type="checkbox" [formField]="form.published" /> Publier sur le site</label>
    @if (error()) { <p class="note">{{ error() }}</p> }
    <div class="actions">
      <button class="btn btn-navy" type="submit">Enregistrer</button>
      @if (editingId()) { <button appDelete type="button" (click)="remove()"></button> }
    </div>
  </form>
</div>
